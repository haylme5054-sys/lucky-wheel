<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الحظ التفاعلية</title>
    <script src="https://telegram.org"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --gold-main: #ffd700;
            --gold-dark: #b8860b;
            --neon-blue: #00f3ff;
            --neon-green: #00ff88;
            --neon-red: #ff3366;
            --neon-purple: #bc13fe;
            --card-bg: rgba(18, 22, 41, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #141b38 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px 18px;
            overflow-x: hidden;
            position: relative;
        }

        body.win-flash-bg {
            animation: bgRainbowPulse 0.8s ease-in-out 3;
        }

        @keyframes bgRainbowPulse {
            0%, 100% { box-shadow: inset 0 0 0px transparent; }
            25% { box-shadow: inset 0 0 70px rgba(255, 215, 0, 0.45); }
            50% { box-shadow: inset 0 0 90px rgba(0, 243, 255, 0.5); }
            75% { box-shadow: inset 0 0 70px rgba(188, 19, 254, 0.45); }
        }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
        }

        .floating-win-banner {
            position: fixed;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 95;
            font-size: 2.1rem;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(90deg, #ffd700, #00f3ff, #00ff88, #ff2a5f, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.9)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
        }

        .floating-win-banner.show {
            animation: winTextPop 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards, shimmerText 1s linear infinite;
        }

        .kafoo-fire-banner {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.3);
            z-index: 98;
            font-size: 3.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            color: #fff700;
            text-shadow:
                0 0 10px #fff,
                0 0 22px #ffae00,
                0 0 40px #ff5500,
                0 0 65px #ff0000,
                0 -8px 25px #ff7700;
        }

        .kafoo-fire-banner.ignite {
            animation:
                kafooEntrance 3.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards,
                fireFlicker 0.14s infinite alternate;
        }

        @keyframes kafooEntrance {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.3); }
            15% { opacity: 1; transform: translate(-50%, -10px) scale(1.25); }
            28% { transform: translate(-50%, -5px) scale(1.08); }
            80% { opacity: 1; transform: translate(-50%, -18px) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(0.95); }
        }

        @keyframes fireFlicker {
            0% {
                text-shadow:
                    0 0 8px #fff,
                    0 0 20px #ffae00,
                    0 0 38px #ff4500,
                    0 -6px 22px #ff2200;
                filter: brightness(1.05);
            }
            100% {
                text-shadow:
                    0 0 14px #fff,
                    0 0 30px #ffd700,
                    0 0 55px #ff6600,
                    0 0 80px #ff0000,
                    0 -14px 32px #ff9900;
                filter: brightness(1.3);
            }
        }

        @keyframes winTextPop {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.4); }
            18% { opacity: 1; transform: translate(-50%, -15px) scale(1.15); }
            30% { transform: translate(-50%, -10px) scale(1.0); }
            80% { opacity: 1; transform: translate(-50%, -25px) scale(1.05); }
            100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); }
        }

        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        .header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.12);
            gap: 8px;
            z-index: 10;
        }

        .title-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wheel-title {
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #fff, var(--gold-main), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .edit-title-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: var(--gold-main);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .balance-badge {
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid var(--neon-green);
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--neon-green);
            direction: ltr;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .balance-badge.pulse-win {
            transform: scale(1.15);
            box-shadow: 0 0 25px var(--neon-green);
        }

        .wheel-stage {
            position: relative;
            width: 325px;
            height: 325px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--gold-dark), var(--gold-main), #fff8dc, var(--gold-dark), var(--gold-main));
            padding: 11px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.3s;
        }

        .outer-ring.win-glow {
            animation: ringNeonFlash 0.45s alternate infinite;
        }

        @keyframes ringNeonFlash {
            0% {
                box-shadow: 0 0 35px #ffd700, 0 0 70px #ff2a5f, inset 0 0 20px #ffd700;
                filter: brightness(1.15);
            }
            50% {
                box-shadow: 0 0 45px #00f3ff, 0 0 85px #bc13fe, inset 0 0 25px #00f3ff;
                filter: brightness(1.3);
            }
            100% {
                box-shadow: 0 0 40px #00ff88, 0 0 80px #ffd700, inset 0 0 20px #00ff88;
                filter: brightness(1.2);
            }
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0b0f24;
        }

        .intro-coupons-card {
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 27, 56, 0.96) 0%, rgba(7, 9, 19, 0.98) 100%);
            border: 2px solid var(--gold-main);
            z-index: 18;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(255, 215, 0, 0.25);
            transition: opacity 0.45s ease, transform 0.45s ease;
            cursor: pointer;
        }

        .intro-coupons-card.hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        .intro-badge {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid rgba(0, 243, 255, 0.4);
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .intro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 86%;
            margin: 4px 0;
        }

        .intro-item {
